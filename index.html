<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cubey Craft</title>
<meta name="description" content="Fly a little drone-cube between block pillars: dashes, combos, 4 biomes and 5 characters to unlock.">
<meta name="theme-color" content="#0d1218">
<meta property="og:title" content="Cubey Craft">
<meta property="og:description" content="Arcade game: dodge the pillars, grab gems, unlock characters.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='8' y='8' width='48' height='48' rx='9' fill='%235d8ea3'/%3E%3Crect x='18' y='24' width='30' height='13' rx='5' fill='%230a1418'/%3E%3Crect x='23' y='28' width='6' height='5' fill='%23ffbe5a'/%3E%3Crect x='37' y='28' width='6' height='5' fill='%23ffbe5a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter+Tight:wght@500;600&display=swap">
<style>
/* layout: plein écran, canvas 16:9 centré, univers unique en lumière de fin de journée */
:root{--bg:#0d1218;--fg:#f3ece0;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden}
#wrap{display:flex;align-items:center;justify-content:center;height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
canvas{width:100%;max-width:1200px;max-height:100%;aspect-ratio:16/9;border-radius:10px;box-shadow:0 20px 60px #000c;touch-action:none;display:block}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="720" tabindex="0" aria-label="Jeu Cubey Craft"></canvas></div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d');
const W=1280,H=720,B=48,GROUND=H-B*2,HX=220;
const R=Math.random,lerp=(a,b,k)=>a+(b-a)*k,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let best=0;try{best=+localStorage.getItem('cubeyBest')||0}catch(e){}

/* ---------- audio ---------- */
let ac=null,musicOn=true,mt=null,step=0,master,rev;
function audio(){if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.9;
 // petite réverb par convolution
 rev=ac.createConvolver();const len=ac.sampleRate*2,buf=ac.createBuffer(2,len,ac.sampleRate);for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(R()*2-1)*Math.pow(1-i/len,3);}rev.buffer=buf;
 const wet=ac.createGain();wet.gain.value=.35;rev.connect(wet).connect(ac.destination);master.connect(ac.destination);master.connect(rev);}
 if(ac.state==='suspended')ac.resume();}
function tone(f,d,type='sine',v=.06,t0=0,slide=0){if(!ac)return;const t=ac.currentTime+t0,o=ac.createOscillator(),g=ac.createGain(),lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(lp).connect(g).connect(master);o.start(t);o.stop(t+d+.05);}
function noise(d,v=.1,f=800){if(!ac)return;const n=ac.createBufferSource(),b=ac.createBuffer(1,ac.sampleRate*d,ac.sampleRate),dd=b.getChannelData(0);for(let i=0;i<dd.length;i++)dd[i]=R()*2-1;n.buffer=b;const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f;const g=ac.createGain();g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);n.connect(bp).connect(g).connect(master);n.start();}
const sfx={flap:()=>{noise(.18,.12,600);tone(220,.12,'sine',.03,0,1.6)},gem:()=>{tone(1318,.25,'sine',.05);tone(1975,.4,'sine',.035,.06)},hit:()=>{noise(.5,.35,180);tone(80,.5,'sawtooth',.07,0,.5)},power:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.4,'triangle',.05,i*.07)),over:()=>[392,330,262,196].forEach((f,i)=>tone(f,.8,'triangle',.06,i*.25)),
 dash:()=>{noise(.3,.2,1500);tone(300,.25,'sawtooth',.03,0,3)},crash:()=>{noise(.45,.35,900);tone(140,.3,'square',.04,0,.4)},perfect:c=>tone(660*Math.pow(1.06,Math.min(c,12)),.25,'sine',.04)};
const CH=[[220,262,330,392],[175,220,262,349],[196,247,294,392],[165,196,247,330]];
function music(){if(mt)return;mt=setInterval(()=>{if(!musicOn||state!=='play'||!ac)return;const c=CH[(step/16|0)%4];if(step%2===0)tone(c[(step/2|0)%4]*2,.9,'triangle',.018);if(step%16===0){tone(c[0]/2,3.5,'sine',.05);tone(c[2]/2,3.5,'sine',.025);}step++;},230);}

/* ---------- textures pré-rendues ---------- */
function mk(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);return c;}
function grain(g,w,h,base,vari,n=1400,sz=2){g.fillStyle=base;g.fillRect(0,0,w,h);for(let i=0;i<n;i++){const k=(R()-.5)*vari;g.fillStyle=k>0?`rgba(255,255,255,${k})`:`rgba(0,0,0,${-k})`;g.fillRect(R()*w|0,R()*h|0,sz,sz);}}
function bevel(g,w,h){const a=g.createLinearGradient(0,0,0,h);a.addColorStop(0,'rgba(255,240,210,.18)');a.addColorStop(.5,'rgba(0,0,0,0)');a.addColorStop(1,'rgba(0,0,0,.35)');g.fillStyle=a;g.fillRect(0,0,w,h);g.strokeStyle='rgba(0,0,0,.45)';g.lineWidth=2;g.strokeRect(1,1,w-2,h-2);g.strokeStyle='rgba(255,235,200,.12)';g.beginPath();g.moveTo(2,h-3);g.lineTo(2,2);g.lineTo(w-3,2);g.stroke();}
const TEX={
 stone:[0,1,2].map(()=>mk(B,B,(g,w,h)=>{grain(g,w,h,'#7b7a76',.22,900,3);for(let i=0;i<5;i++){g.fillStyle=`rgba(${R()<.5?'40,40,38':'170,168,160'},.25)`;g.beginPath();g.ellipse(R()*w,R()*h,4+R()*8,3+R()*6,R()*3,0,7);g.fill();}g.strokeStyle='rgba(20,20,20,.35)';g.lineWidth=1;g.beginPath();g.moveTo(R()*w,0);for(let i=0;i<4;i++)g.lineTo(R()*w,h*(i+1)/4);g.stroke();bevel(g,w,h);})),
 dirt:[0,1].map(()=>mk(B,B,(g,w,h)=>{grain(g,w,h,'#5b4030',.3,1600,2);for(let i=0;i<6;i++){g.fillStyle='rgba(140,120,100,.5)';g.fillRect(R()*w,R()*h,3,2);}bevel(g,w,h);})),
 wood:[0,1].map(()=>mk(B,B,(g,w,h)=>{g.fillStyle='#7a5432';g.fillRect(0,0,w,h);for(let y=0;y<h;y++){g.fillStyle=`rgba(${R()<.5?'40,22,10':'190,140,90'},${.08+R()*.12})`;g.fillRect(0,y,w,1);}g.strokeStyle='rgba(30,16,6,.5)';g.lineWidth=2;g.beginPath();g.moveTo(0,h/2);g.lineTo(w,h/2);g.stroke();g.fillStyle='rgba(40,20,8,.55)';g.beginPath();g.ellipse(R()*w,R()*h,4,2.5,0,0,7);g.fill();g.fillStyle='#2a2a2a';[[5,h/4],[w-7,h/4],[5,3*h/4],[w-7,3*h/4]].forEach(([a,b])=>{g.beginPath();g.arc(a,b,1.6,0,7);g.fill();});bevel(g,w,h);})),
 brick:[0,1].map(()=>mk(B,B,(g,w,h)=>{g.fillStyle='#b8b0a0';g.fillRect(0,0,w,h);const rows=4,rh=h/rows;for(let r=0;r<rows;r++){const off=r%2?w/4:0;for(let c=-1;c<2;c++){const bx=c*w/2+off+1,by=r*rh+1;const col=[150+R()*30,60+R()*20,45+R()*15];g.fillStyle=`rgb(${col})`;g.fillRect(bx,by,w/2-2,rh-2);for(let i=0;i<40;i++){g.fillStyle=`rgba(0,0,0,${R()*.2})`;g.fillRect(bx+R()*(w/2-2),by+R()*(rh-2),2,1);}}}bevel(g,w,h);})),
 grass:[0,1,2].map(()=>mk(B,B,(g,w,h)=>{grain(g,w,h,'#5b4030',.3,1400,2);const gr=g.createLinearGradient(0,0,0,16);gr.addColorStop(0,'#7fae3e');gr.addColorStop(1,'#4d7a26');g.fillStyle=gr;g.fillRect(0,0,w,13);for(let i=0;i<w;i+=2){g.fillStyle=R()<.5?'#5f8f2c':'#3f6a1f';g.fillRect(i,11,2,2+R()*6);}bevel(g,w,h);}))
};
const MATS=['stone','wood','brick','wood'];
TEX.sand=[0,1,2].map(()=>mk(B,B,(g,w,h)=>{grain(g,w,h,'#c9a46a',.25,1500,2);g.strokeStyle='rgba(120,80,30,.25)';for(let i=8;i<h;i+=12){g.beginPath();g.moveTo(0,i);g.quadraticCurveTo(w/2,i+4,w,i);g.stroke();}bevel(g,w,h);}));
TEX.snow=[0,1,2].map(()=>mk(B,B,(g,w,h)=>{grain(g,w,h,'#5b4a40',.3,1400,2);const gr=g.createLinearGradient(0,0,0,16);gr.addColorStop(0,'#ffffff');gr.addColorStop(1,'#c8d8ea');g.fillStyle=gr;g.fillRect(0,0,w,12);for(let i=0;i<w;i+=3){g.fillStyle='#e6eef8';g.fillRect(i,10,3,2+R()*5);}bevel(g,w,h);}));
/* biomes : changent tous les 25 points */
const BIOMES=[
 {n:'Forest',d:'The calm before the storm',grav:1,wind:0,dark:0,tint:null,top:'grass',low:'dirt'},
 {n:'Desert',d:'Unpredictable gusts of wind',grav:1,wind:1,dark:0,tint:'rgba(255,160,60,.22)',top:'sand',low:'sand'},
 {n:'Cave',d:'Only your light shows the way',grav:1,wind:0,dark:.86,tint:'rgba(30,20,50,.45)',top:'stone',low:'stone'},
 {n:'Snowy Peaks',d:'Low gravity, icy air',grav:.72,wind:0,dark:0,tint:'rgba(170,205,255,.28)',top:'snow',low:'dirt'}];
function BIO(){return BIOMES[g&&state!=='title'?g.biome:0];}
/* skins + sauvegarde */
const SKINS=[
 {n:'Steel',c:['#cfe3ea','#5d8ea3','#244b5e','#122a36'],eye:'255,190,90',p:0},
 {n:'Solid Gold',c:['#fff2b0','#e0b040','#9a6a10','#4a3005'],eye:'255,255,255',p:40},
 {n:'Obsidian',c:['#9a7ac0','#3a2550','#1a1028','#08040e'],eye:'200,120,255',p:80},
 {n:'Neon',c:['#c0fff0','#20e0b0','#0a6a70','#04202a'],eye:'255,60,200',p:150},
 {n:'Ember',c:['#ffd0a0','#e0602a','#7a2010','#2a0804'],eye:'255,240,120',p:250}];
let save={bank:0,owned:[0],skin:0};try{Object.assign(save,JSON.parse(localStorage.getItem('cubeySave'))||{})}catch(e){}
function store(){try{localStorage.setItem('cubeySave',JSON.stringify(save))}catch(e){}}
let sel=save.skin,lockMsg=0;
function skinOf(){return state==='title'?sel:save.skin;}
function browse(d){audio();sel=(sel+d+SKINS.length)%SKINS.length;tone(520,.08,'sine',.04);}
function buySel(){audio();if(save.owned.includes(sel)){save.skin=sel;sfx.gem();}else if(save.bank>=SKINS[sel].p){save.bank-=SKINS[sel].p;save.owned.push(sel);save.skin=sel;sfx.power();}else tone(150,.25,'square',.04);store();}
const DASHES=[
 {n:'Charge',d:'rushes forward and smashes wood',cd:480},
 {n:'Gold Rush',d:'pulls in every gem, each worth double',cd:600},
 {n:'Phase',d:'turns ghostly and passes through pillars for 5 s',cd:900},
 {n:'Quantum Leap',d:'teleports to the center of the next gap',cd:600},
 {n:'Shockwave',d:'blasts the next pillar, even stone',cd:720}];
function dash(){if(state!=='play'||g.dcd>0)return;const k=save.skin;g.dcd=g.dcdMax=DASHES[k].cd;sfx.dash();
 if(k===0){g.dash=22;g.vy=0;burst(HX,g.y,'120,220,255',14,6,1);}
 if(k===1){g.gold=180;burst(HX,g.y,'255,215,100',30,9,1);}
 if(k===2){g.phase=300;burst(HX,g.y,'180,120,255',24,7,1);}
 if(k===3){const o=g.obs.filter(o=>!o.broken&&o.x+o.w>HX-22).sort((a,b)=>a.x-b.x)[0];burst(HX,g.y,'255,60,200',20,6,1);if(o)g.y=o.top+o.gap/2;g.vy=-2;g.inv=Math.max(g.inv,20);burst(HX,g.y,'80,255,220',20,6,1);}
 if(k===4){const o=g.obs.filter(o=>!o.broken&&o.x>HX-22&&o.x<HX+520).sort((a,b)=>a.x-b.x)[0];shake=16;flash=.3;burst(HX,g.y,'255,140,60',36,14,1);if(o){o.broken=true;sfx.crash();for(let i=0;i<4;i++)debris(o.x+B,o.top+(R()-.5)*300,o.mat);g.score+=2;g.pop.push({x:o.x,y:g.y-40,s:'BOOM +2',l:50});}}}
function passCol(o){const perfect=!o.broken&&Math.abs(g.y-(o.top+o.gap/2))<26;if(perfect)g.combo++;else g.combo=0;const m=1+Math.min(4,g.combo>>1);
 g.score+=m;g.speed=Math.min(10,5+g.score*.12);g.pop.push({x:HX,y:g.y-50,s:perfect?'PERFECT  x'+m:'+'+m,l:45});if(perfect)sfx.perfect(g.combo);
 const nb=(g.score/25|0)%4;if(nb!==g.biome){g.biome=nb;g.banner=200;sfx.power();}}
// montagnes en couches avec perspective atmosphérique
function ridge(w,h,amp,base,rough,col,snow){return mk(w,h,(g)=>{const pts=[];let y=base;for(let i=0;i<=w;i+=4){y+=(R()-.5)*rough;y=lerp(y,base,.02);pts.push([i,y-Math.sin(i/w*Math.PI*2*2)*amp*.3]);}pts[pts.length-1][1]=pts[0][1];
 g.beginPath();g.moveTo(0,h);pts.forEach(p=>g.lineTo(p[0],p[1]));g.lineTo(w,h);g.closePath();const gr=g.createLinearGradient(0,base-amp,0,h);gr.addColorStop(0,col[0]);gr.addColorStop(1,col[1]);g.fillStyle=gr;g.fill();
 if(snow){g.save();g.clip();g.fillStyle='rgba(255,236,220,.55)';g.beginPath();pts.forEach(p=>{if(p[1]<base-amp*.15)g.rect(p[0],p[1],4,8+R()*10);});g.fill();g.restore();}
 g.globalCompositeOperation='source-atop';for(let i=0;i<w;i+=3){g.fillStyle=`rgba(0,0,0,${R()*.06})`;g.fillRect(i,0,2,h);}})}
const L1=ridge(2560,H,160,330,26,['#8a6f86','#c79a8a'],true),L2=ridge(2560,H,120,430,20,['#4f4a5e','#7a6670']),L3=ridge(2560,H,90,520,16,['#2a3236','#3c4440']);
// forêt
const TREES=mk(2560,H,(g)=>{for(let i=0;i<260;i++){const tx=R()*2560,th=40+R()*70,ty=GROUND+6;g.fillStyle=`rgb(${20+R()*10},${34+R()*12},${30+R()*8})`;g.beginPath();g.moveTo(tx,ty-th);g.lineTo(tx-th*.22,ty);g.lineTo(tx+th*.22,ty);g.fill();}});
const clouds=Array.from({length:7},()=>({x:R()*W,y:40+R()*220,s:.6+R()*.9,v:.15+R()*.3,puffs:Array.from({length:8},()=>[R()*160-80,R()*30-15,30+R()*40])}));
const dust=Array.from({length:60},()=>({x:R()*W,y:R()*H,s:R()*2+.5,v:.2+R()*.6,p:R()*7}));

/* ---------- jeu ---------- */
let state='title',g,t=0,shake=0,flash=0,slowmo=1,last=performance.now(),off={m1:0,m2:0,m3:0,tr:0,gr:0};
function reset(){g={y:H/2,vy:0,rot:0,lives:5,score:0,gems:0,obs:[],items:[],parts:[],speed:5,spawn:0,inv:0,shield:0,slow:0,magnet:0,trail:[],combo:0,pop:[],wait:true,dash:0,dcd:0,dcdMax:200,biome:0,banner:0,phase:0,gold:0};}
function flap(){audio();music();if(state==='title'||state==='over'){if(state==='title'){if(save.owned.includes(sel)){save.skin=sel;store();}else{lockMsg=120;tone(150,.25,'square',.04);return;}}startRun();return;}if(state==='pause'||adPlaying)return;g.wait=false;g.vy=-10.5;sfx.flap();for(let i=0;i<8;i++)g.parts.push({x:HX-10,y:g.y+20,vx:-1-R()*3,vy:1+R()*2,l:30,ml:30,c:'220,210,190',s:3+R()*5,smoke:1});}
addEventListener('keydown',e=>{if(adPlaying)return;if(state==='over'){if(e.code==='KeyR'){revive();return}if(e.code==='KeyG'){doubleGems();return}}if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(!e.repeat)flap();}
 if(['ShiftLeft','ShiftRight','KeyD'].includes(e.code)&&!e.repeat)dash();
 if(state==='title'){if(e.code==='ArrowLeft')browse(-1);if(e.code==='ArrowRight')browse(1);if(e.code==='Enter')buySel();}if(e.code==='KeyP'&&(state==='play'||state==='pause'))state=state==='play'?'pause':'play';if(e.code==='KeyM')musicOn=!musicOn;if((e.code==='KeyH'||e.code==='Escape')&&(state==='over'||state==='pause'))goHome();});
cv.addEventListener('pointerdown',e=>{e.preventDefault();if(adPlaying)return;const r=cv.getBoundingClientRect(),px=(e.clientX-r.left)*W/r.width,py=(e.clientY-r.top)*H/r.height;
 if(state==='over'&&Ads.on&&py>428&&py<480){if(px>W/2-232&&px<W/2-12){revive();return}if(px>W/2+12&&px<W/2+232){doubleGems();return}}
 if(state==='title'){if(Math.hypot(px-130,py-200)<40){browse(-1);return}if(Math.hypot(px-310,py-200)<40){browse(1);return}if(py>245&&py<305&&Math.abs(px-HX)<130){buySel();return}}
 if((state==='over'||state==='pause')&&Math.abs(px-W/2)<110&&py>548&&py<604){goHome();return}
 if((state==='play'||state==='pause')&&px>292&&px<352&&py>18&&py<78){state=state==='play'?'pause':'play';return}
 if(state==='pause'){state='play';return}
 if(state==='play'&&Math.hypot(px-(W-90),py-(H-90))<60){dash();return}flap();});
function spawn(){const gap=Math.max(195,285-g.score*3)+(g.biome===1?55:0),top=B*2+R()*(GROUND-gap-B*4),mat=MATS[R()*MATS.length|0];
 const cols=Array.from({length:40},()=>R()*3|0);
 g.obs.push({x:W+40,w:B*2,top,gap,mat,cols,passed:false,dy:g.score>10&&R()<.35?(R()<.5?-1.1:1.1):0});
 const k=R()<.75?'gem':['shield','slow','magnet','life'][R()*4|0];g.items.push({x:W+40+B,y:top+gap/2,k,ph:R()*7});}
function burst(px,py,c,n=12,sp=10,glow=0){for(let i=0;i<n;i++){const a=R()*7,v=R()*sp;g.parts.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:40+R()*20,ml:60,c,s:2+R()*5,glow});}}
function debris(px,py,mat){for(let i=0;i<14;i++)g.parts.push({x:px,y:py,vx:(R()-.3)*8,vy:-R()*8,l:70,ml:70,s:5+R()*7,deb:mat,r:R()*6,vr:(R()-.5)*.4});}
function hurt(){if(g.inv>0)return;if(g.shield>0){g.shield=0;g.inv=60;burst(HX,g.y,'120,200,255',30,12,1);sfx.hit();flash=.4;return;}
 g.lives--;g.inv=100;shake=22;flash=.7;slowmo=.25;g.combo=0;debris(HX,g.y,'stone');burst(HX,g.y,'255,120,80',24,9,1);sfx.hit();
 if(g.lives<=0){state='over';g.revived=g.revived||false;g.doubled=false;Ads.stop();sfx.over();save.bank+=g.gems-(g.banked||0);g.banked=g.gems;store();if(g.score>best){best=g.score;try{localStorage.setItem('cubeyBest',best)}catch(e){}}}}
function update(dt){t+=dt;clouds.forEach(c=>{c.x-=c.v*dt;if(c.x<-250){c.x=W+250;c.y=40+R()*220}});
 const bi=g&&state!=='title'?g.biome:0;dust.forEach(d=>{d.x-=d.v*dt*(bi===1?9:bi===3?2:1);d.y+=bi===3?(1+d.s*.5)*dt:Math.sin(t*.02+d.p)*.2;if(d.x<0)d.x=W;if(d.y>H)d.y=0;});
 slowmo=lerp(slowmo,1,.04);
 const base=state==='play'?g.speed*(g.slow>0?.55:1)*(g.dash>0?2.4:1):1.2,sp=base*dt;
 off.m1+=sp*.06;off.m2+=sp*.14;off.m3+=sp*.28;off.tr+=sp*.5;off.gr+=sp;
 if(state==='title'){g=null;}
 if(!g)return;

const Ads={on:false,
 async init(){try{const S=window.CrazyGames&&window.CrazyGames.SDK;if(!S)return;await S.init();this.on=S.environment==='crazygames'||S.environment==='local';}catch(e){this.on=false;}},
 sdk(){return window.CrazyGames.SDK;},
 start(){if(this.on)try{this.sdk().game.gameplayStart()}catch(e){}},
 stop(){if(this.on)try{this.sdk().game.gameplayStop()}catch(e){}},
 show(type,onOk,onFail){if(!this.on){onFail&&onFail();return;}
  const end=ok=>{adPlaying=false;if(ac)ac.resume();ok?onOk&&onOk():onFail&&onFail();};
  try{this.sdk().ad.requestAd(type,{adStarted:()=>{adPlaying=true;if(ac)ac.suspend();},adFinished:()=>end(true),adError:()=>end(false)});}catch(e){end(false);}}};
Ads.init();
function startRun(){runs++;const go=()=>{reset();state='play';Ads.start();};if(runs>1&&runs%3===1)Ads.show('midgame',go,go);else go();}
function revive(){if(state!=='over'||g.revived)return;Ads.show('rewarded',()=>{g.revived=true;g.wait=true;g.lives=1;g.inv=150;g.y=H/2;g.vy=0;g.obs=g.obs.filter(o=>o.x>HX+260||o.x+o.w<HX-60);state='play';Ads.start();sfx.power();},()=>{adMsg=120;});}
function doubleGems(){if(state!=='over'||g.doubled||!g.gems)return;Ads.show('rewarded',()=>{g.doubled=true;save.bank+=g.gems;store();g.pop.push({x:W/2,y:330,s:'+'+g.gems+' gems',l:80});sfx.gem();},()=>{adMsg=120;});}
let adMsg=0;
function adBtn(x0,label,sub,on){panel(x0,428,220,52);x.globalAlpha=on?1:.4;x.fillStyle='#ffd9a0';x.beginPath();x.moveTo(x0+18,442);x.lineTo(x0+34,454);x.lineTo(x0+18,466);x.fill();text(label,x0+122,453,17,'#f3ece0','700');text(sub,x0+122,472,12,'rgba(243,236,224,.7)','500','center',FB);x.globalAlpha=1;}
function goHome(){state='title';sel=save.skin;}
function homeBtn(){panel(W/2-110,548,220,56);x.fillStyle='#ffd9a0';x.beginPath();x.moveTo(W/2-72,580);x.lineTo(W/2-58,567);x.lineTo(W/2-44,580);x.closePath();x.fill();x.fillRect(W/2-68,580,20,12);text('HOME',W/2+18,585,22,'#f3ece0','700');text('key H',W/2,628,13,'rgba(243,236,224,.55)','500','center',FB);}
function shopUI(){const s=SKINS[sel],own=save.owned.includes(sel);
 [[130,-1],[310,1]].forEach(([ax,d])=>{panel(ax-26,174,52,52);x.fillStyle='#ffd9a0';x.beginPath();x.moveTo(ax+d*10,200);x.lineTo(ax-d*8,188);x.lineTo(ax-d*8,212);x.fill();});
 text(s.n.toUpperCase(),HX,272,24,'#fff1dc','700');
 const st=own?(save.skin===sel?'EQUIPPED':'ENTER / TAP: EQUIP'):(s.p+' gems · '+(save.bank>=s.p?'ENTER / TAP: BUY':'not enough gems'));
 text(st,HX,296,14,own?'#7dffc0':'#ffd9a0','600','center',FB);
 if(lockMsg>0){lockMsg--;text('Locked skin: buy it first',HX,320,15,'#ff8a70','600','center',FB);}
 panel(24,22,250,40);text('Bank  '+save.bank+' gems',40,48,16,'#7dffc0','600','left',FB);}
function hudExtra(){const cx=W-90,cy=H-90,rd=g.dcd>0?1-g.dcd/g.dcdMax:1;
 x.fillStyle='rgba(10,14,18,.55)';x.beginPath();x.arc(cx,cy,46,0,7);x.fill();
 x.strokeStyle=rd>=1?'#78dcff':'rgba(120,220,255,.4)';x.lineWidth=5;x.beginPath();x.arc(cx,cy,42,-Math.PI/2,-Math.PI/2+rd*Math.PI*2);x.stroke();
 text(DASHES[save.skin].n.toUpperCase(),cx,cy+3,DASHES[save.skin].n.length>8?11:16,rd>=1?'#e8f8ff':'rgba(232,248,255,.45)','700');text('Shift',cx,cy+22,12,'rgba(232,248,255,.6)','500','center',FB);
 if(g.combo>=2)text('COMBO '+g.combo,W-129,142,20,'#ffd9a0','700');
 if(g.banner>0){const a=clamp(g.banner/40,0,1)*clamp((200-g.banner)/20,0,1),b=BIO();text(b.n.toUpperCase(),W/2,150,50,`rgba(255,241,220,${a})`,'700');text(b.d,W/2,184,18,`rgba(255,217,160,${a})`,'500','center',FB);}}
let tut=0;try{tut=+localStorage.getItem('cubeyTut')||0}catch(e){}
function tutorial(){if(state!=='play'||tut>=3||!g)return;const msgs=['TAP / SPACE TO FLY UP','FLY THROUGH THE GAPS','SHIFT / ROUND BUTTON: SPECIAL ABILITY'];const step=g.score<1?0:g.score<3?1:2;if(step===2&&g.score>=6){tut=3;try{localStorage.setItem('cubeyTut',3)}catch(e){}return;}
 const a=.85+Math.sin(t*.1)*.15;x.fillStyle='rgba(8,10,14,.82)';x.beginPath();x.roundRect(W/2-280,146,560,60,8);x.fill();x.strokeStyle='rgba(140,255,200,.6)';x.lineWidth=2;x.stroke();text(msgs[step],W/2,186,24,`rgba(170,255,215,${a})`,'700');if(step===0&&g.wait){x.fillStyle=`rgba(255,255,255,${a})`;x.beginPath();x.moveTo(HX+60,g.y-10);x.lineTo(HX+40,g.y-34);x.lineTo(HX+80,g.y-34);x.fill();}}
function loop(now){const dt=adPlaying?0:clamp((now-last)/16.667,0,3)*slowmo;last=now;update(dt);draw();tutorial();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>

</body>
</html>
